<section id="faq" class="faq-section">
  <div class="container faq-container">
    <div class="faq-header">
      <h2 class="faq-title">FAQ</h2>
      <p class="faq-subtitle">Quick answers</p>
    </div>

    <div class="faq-content">
      <div class="faq-list">
        <div class="faq-item" data-faq="item">
          <button class="faq-question-btn" data-faq="button" aria-expanded="false">
            <span class="faq-question"
              >Is Annoying Cats : Tricky Puzzle easy to play?</span
            >
            <svg class="faq-arrow-icon" width="18" height="10">
              <use href="img/sprite.svg#icon-arrow-down"></use>
            </svg>
          </button>
          <div class="faq-answer-wrapper">
            <div class="faq-answer">
              <div class="faq-answer-inner">
                Yes, the controls are simple and beginner-friendly.
              </div>
            </div>
          </div>
        </div>

        <div class="faq-item" data-faq="item">
          <button class="faq-question-btn" data-faq="button" aria-expanded="false">
            <span class="faq-question"
              >Are the puzzles serious or comedic?</span
            >
            <svg class="faq-arrow-icon" width="18" height="10">
              <use href="img/sprite.svg#icon-arrow-down"></use>
            </svg>
          </button>
          <div class="faq-answer-wrapper">
            <div class="faq-answer">
              <div class="faq-answer-inner">
                The gameplay is designed around humor and funny situations.
              </div>
            </div>
          </div>
        </div>

        <div class="faq-item" data-faq="item">
          <button class="faq-question-btn" data-faq="button" aria-expanded="false">
            <span class="faq-question">Do levels become more challenging?</span>
            <svg class="faq-arrow-icon" width="18" height="10">
              <use href="img/sprite.svg#icon-arrow-down"></use>
            </svg>
          </button>
          <div class="faq-answer-wrapper">
            <div class="faq-answer">
              <div class="faq-answer-inner">
                Yes, puzzle complexity increases gradually over time.
              </div>
            </div>
          </div>
        </div>

        <div class="faq-item" data-faq="item">
          <button class="faq-question-btn" data-faq="button" aria-expanded="false">
            <span class="faq-question"
              >What style should the landing page follow?</span
            >
            <svg class="faq-arrow-icon" width="18" height="10">
              <use href="img/sprite.svg#icon-arrow-down"></use>
            </svg>
          </button>
          <div class="faq-answer-wrapper">
            <div class="faq-answer">
              <div class="faq-answer-inner">
                Playful, colorful, expressive, and comedy-focused.
              </div>
            </div>
          </div>
        </div>

        <div class="faq-item" data-faq="item">
          <button class="faq-question-btn" data-faq="button" aria-expanded="false">
            <span class="faq-question"
              >Is the game suitable for casual gameplay?</span
            >
            <svg class="faq-arrow-icon" width="18" height="10">
              <use href="img/sprite.svg#icon-arrow-down"></use>
            </svg>
          </button>
          <div class="faq-answer-wrapper">
            <div class="faq-answer">
              <div class="faq-answer-inner">
                Yes, levels are optimized for short relaxing sessions.
              </div>
            </div>
          </div>
        </div>
      </div>

      <picture class="faq-picture">
        <source srcset="img/FAQ.png 1x, img/FAQ@2x.png 2x" />
        <img
          src="img/FAQ.png"
          alt="Cat playing with a lamp"
          class="faq-img"
          width="526"
          height="410"
        />
      </picture>
    </div>
  </div>
</section>
